[package]
name = "mosslight"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "A single-player, top-down terminal adventure."
license = "MIT"

[[bin]]
name = "mosslight"
path = "src/main.rs"

[lib]
name = "mosslight"
path = "src/lib.rs"

[dependencies]
ratatui = "0.30.2"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
serde_json = "1"
signal-hook = "0.4"
